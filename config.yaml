# ==========================================================================
# 本地媒体资源转码与整理工具 · 配置文件
# 说明：相对路径相对“运行脚本时所在目录”解析，也可用绝对路径。
# ==========================================================================

# 输入目录：存放要转码的本地媒体素材（.gif / .mp4 / .webm / 图片序列混合）
input_dir: ./input

# 输出目录：转换/优化后的 GIF 统一输出到这里
output_dir: ./output

# ---------------------------- 视频转 GIF --------------------------------
video:
  duration: 3.0        # 只取视频前 N 秒作为“高光片段”；0 表示取全程
  fps: 12              # 输出帧率（帧/秒），10~15 是表情包常用区间
  width: 480           # 输出宽度（px），高度按比例缩放；0 或 -1 表示保持原始宽度
  loop: 0              # GIF 循环次数：0 = 无限循环

# ------------------- 已有 GIF 的优化 / 图片序列合成 ----------------------
gif:
  max_width: 480       # 宽度超过该值就等比缩小
  fps: 12              # 帧率统一到该值（超过则抽帧压缩）
  max_duration: 5.0    # 时长超过该值就截断（秒）
  max_size_kb: 0       # 体积上限（KB）；>0 时超限会自动降分辨率/降帧率重编码，0 = 不限
  loop: 0              # 循环次数：0 = 无限循环

# ----------------------- 调色板两步法参数（一般不用改） -------------------
palette:
  # full=对全部帧统计；diff=对帧间差异统计（动图/渐变多时画质更佳）；single=只取一帧
  stats_mode: full
  # 抖动算法：floyd_steinberg(默认/平滑) / sierra2_4a / bayer / none(更锐但易出色带)
  dither: floyd_steinberg

# ----------------------------- 后期处理（可选） ---------------------------
postprocess:
  speed: 1.0           # 播放速度倍率：2.0=加速一倍，0.5=减速一半，1.0=原速
  crop: ""             # 裁剪，格式 "宽:高:x:y"，例如 "320:320:0:0"；留空不裁剪
  watermark: ""        # 右下角文字水印；留空不加水印
  top_text: ""         # 顶部居中文字；留空不加
  bottom_text: ""      # 底部居中文字；留空不加
  font_size: 22        # 文字字号
  font_color: "white"  # 文字颜色（英文颜色名或 #RRGGBB）
  font_path: ""        # 字体文件路径；留空自动检测（中文自动找微软雅黑/黑体等）

# ------------------------------- 高级 ------------------------------------
advanced:
  ffmpeg_path: ""      # 显式指定 FFmpeg 路径；留空自动查找（系统 PATH → imageio-ffmpeg）
  tmp_dir: ""          # 临时目录；留空使用输出目录下的隐藏临时文件夹
  verbose: false       # 是否打印每条 FFmpeg 命令（排错时打开）
